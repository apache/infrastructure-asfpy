name: Unit Tests

on:
  push:

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libldap2-dev libsasl2-dev ldap-utils slapd
        # The tests of aioldap start a slapd of their own, with its files in
        # a temporary directory, which the AppArmor profile of the package
        # does not allow. Stop the one that the package started, as well.
        sudo systemctl stop slapd || true
        sudo ln -sf /etc/apparmor.d/usr.sbin.slapd /etc/apparmor.d/disable/ || true
        sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd || true
        uv sync --all-extras --python ${{ matrix.python-version }}
    - name: Test with pytest
      run: |
        # -rs lists the tests that were skipped, and why: the tests of
        # aioldap are skipped if slapd could not be started
        uv run pytest -rs
